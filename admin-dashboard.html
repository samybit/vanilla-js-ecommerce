<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Admin</title>
</head>

<body>

  <nav>
    <a href="admin-dashboard.html">ADMIN DASHBOARD</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>

  <div class="admin-section">
    <h3>Manage Categories</h3>
    <input type="text" id="categoryInput" placeholder="New Category Name">
    <button onclick=" addCategory()" class="btn-small">Add Category</button>

    <div id="categoryList">
    </div>
  </div>

  <div class="admin-section">
    <h3>Manage Products</h3>

    <div class="form-container">
      <h4 id="formTitle">Add New Product</h4>
      <input type="hidden" id="productId">

      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="Product Name">
        <small id="nameError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label>Product Image</label>
        <input type="file" id="productImageFile" accept="image/*">
        <input type="hidden" id="productImageBase64">
        <small id="imageError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="productCategory">
          <option value="">Select Category</option>
        </select>
        <small id="categoryError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="productPrice" placeholder="Price">
        <small id="priceError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="productDescription" rows="3" placeholder="Description"></textarea>
        <small id="descError" class="error-msg"></small>
      </div>

      <div class="form-group">
        <label>Stock Quantity</label>
        <input type="number" id="productStock" placeholder="Stock Quantity">
        <small id="stockError" class="error-msg"></small>
      </div>

      <button onclick="saveProduct()" id="saveBtn">Create Product</button>
      <button onclick="resetProdForm()">Clear</button>
    </div>

    <br>
    <h4>Current Products</h4>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Category</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTableBody">
      </tbody>
    </table>
  </div>
  <!-- connected to renderProducts -->
  <div class="admin-section">
    <h3>Manage Orders</h3>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer ID</th>
          <th>Total</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="orderTableBody"> <!-- connected to renderOrders -->
      </tbody>

    </table>
  </div>

  <script src="script.js"></script>
  <script>
    currentUser = checkAuth();

    if (currentUser && currentUser.role === 'admin') {
      loadAdminData();
    }
  </script>
</body>

</html>
