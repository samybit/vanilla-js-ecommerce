<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <nav>
    <a href="products.html">PRODUCTS</a>
    <a href="cart.html">CART</a>
    <a href="orders.html">MY ORDERS</a>
    <a href="#" onclick="logout()">Logout</a>
  </nav>

  <div class="cart-container">
    <h2>Shopping Cart</h2>

    <table>
      <thead>
        <tr>
          <th>Image</th>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="cartTableBody"> <!-- connected to loadCart -->
      </tbody>

    </table>

    <div class="total-sectio n">
      <p>Total: $<span id="cartTotal">0</span></p> <!-- connected to loadCart -->
      <button class="checkout-btn" onclick="checkout()">Place Order</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    currentUser = checkAuth();

    if (currentUser && currentUser.role === 'customer') {
      loadCart();
    }
  </script>
</body>

</html>
