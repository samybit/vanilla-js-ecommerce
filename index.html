<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Login</title>
</head>

<body>

  <!-- Login Section -->
  <div id="loginSection" class="form-container">
    <h2>Login</h2>

    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <p id="loginError" style="color: red;"></p>

    <button onclick="login()">Login</button>
    <p>Don't have an account?
      <button type="button" id="registerLink" class="link-btn">Register here</button>
    </p>
  </div>

  <!-- Register Section -->
  <div id="registerSection" class="form-container hidden">
    <h2>Register</h2>

    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password">
    <p id="regError" style="color: red;"></p>

    <button onclick="register()">Register</button>
    <p>Already have an account?
      <button type="button" id="loginLink" class="link-btn">Login here</button>
    </p>
  </div>

  <script src="script.js"></script>
</body>

</html>
