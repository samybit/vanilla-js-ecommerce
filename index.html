<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Home</title>
</head>

<body>

  <nav>
    <a href="index.html">PRODUCTS</a>
    <a href="wishlist.html">WISHLIST</a>
    <a href="cart.html">CART (<span id="cartCount">0</span>)</a>
    <a href="orders.html">MY ORDERS</a>

    <a href="#" id="authLink">Logout</a>
  </nav>

  <div class="filter-bar">
    <label>Filter by Category:</label>
    <select id="categoryFilter" onchange="renderHomeProducts()">
      <option value="all">All Categories</option>
    </select>
  </div>

  <div id="productsContainer">
  </div>

  <script src="script.js"></script>
  <script>
    // 1. Run checkAuth (it will now return null for guests instead of redirecting)
    currentUser = checkAuth();

    // 2. Initialize the page regardless of login status
    initHome();

    // 3. Handle the Navbar Text (Login vs Logout)
    var authLink = document.getElementById('authLink');
    if (currentUser) {
      authLink.innerText = "Logout";
      authLink.onclick = logout;
    } else {
      authLink.innerText = "Login";
      authLink.href = "login.html";
      authLink.onclick = null;
    }
  </script>
</body>

</html>
